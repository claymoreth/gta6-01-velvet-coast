<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELVET COAST — Port Solana</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/ui/fonts.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud, #minimap { position: fixed; pointer-events: none; }
  #hud { inset: 0; width: 100%; height: 100%; }
  #minimap { left: 16px; bottom: 16px; width: 180px; height: 180px; }
  #menu, #dialog { position: fixed; inset: 0; display: none; }
  #title-screen, #pause-menu { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 40; }
  #damage-flash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(255,0,0,0.45) 100%); opacity: 0; pointer-events: none; z-index: 30; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>
<canvas id="minimap"></canvas>
<div id="damage-flash"></div>
<div id="fade"></div>
<div id="menu">
  <div id="title-screen"></div>
  <div id="pause-menu"></div>
</div>
<div id="dialog"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
